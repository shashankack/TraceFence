openapi: 3.0.3
info:
  title: TraceFence API
  version: 0.2.0
  description: >
    Sketch aligned to PPT option A (source inspect + gateway).
    See docs/contracts.md. Implemented when the lead says implement.
paths:
  /api/sources/inspect:
    post:
      summary: Inspect allowlisted synthetic page (Playwright)
      responses:
        "200":
          description: SOURCE record created
  /api/sources/{id}:
    get:
      summary: Get source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source detail
  /api/tasks:
    post:
      summary: Create task and policy
      responses:
        "200":
          description: Task created
  /api/tasks/{id}:
    get:
      summary: Get task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task detail
  /api/tasks/{id}/run:
    post:
      summary: Start orchestrator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run started
  /api/tasks/{id}/stop:
    post:
      summary: Stop task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stopped
  /api/tasks/{id}/events:
    get:
      summary: Timeline events (source-linked)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event list
  /api/approvals:
    get:
      summary: List approvals
      responses:
        "200":
          description: Approvals
  /api/approvals/{id}/decision:
    post:
      summary: Approve or reject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Decision recorded
  /api/audit:
    get:
      summary: Audit report
      responses:
        "200":
          description: Audit aggregate
